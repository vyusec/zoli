[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
zoli-intel = { path = "crates/zoli-intel" }
zoli-policy = { path = "crates/zoli-policy" }
zoli-proxy = { path = "crates/zoli-proxy" }
zoli-pms = { path = "crates/zoli-pms" }
zoli-shell = { path = "crates/zoli-shell" }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
