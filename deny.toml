# cargo-deny 0.20 configuration. Run with `make deny`.

[graph]
# v1 ships for Linux and macOS only (ADR-001).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Extend only when a new dependency needs it, and say which in the commit.
# Phase 1: BSD-3-Clause for dalek/subtle; BSL-1.0 for Oxc's dragonbox;
# ISC for ring/webpki/untrusted; CDLA-Permissive-2.0 for Mozilla root data.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "BSD-3-Clause", "BSL-1.0", "ISC", "CDLA-Permissive-2.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
